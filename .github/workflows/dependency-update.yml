name: Dependency Update

on:
  # schedule:
    # - cron: '0 0 * * 1'  # 每周一运行
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Update Gradle dependencies
        working-directory: ./Android-kotlin-Code
        run: |
          ./gradlew dependencyUpdates -Drevision=release

      - name: Create pull request for Gradle updates
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update Gradle dependencies
          title: 'Update Gradle dependencies'
          body: |
            ## Dependency Updates
            
            This PR updates Gradle dependencies to their latest versions.
            
            ## Changes
            
            * Updated Gradle dependencies
          branch: dependency-updates/gradle
          delete-branch: true