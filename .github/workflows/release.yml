name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## Changes in this release
            
            * First change
            * Second change
            
            ## Assets
            
            * Android APK
          draft: false
          prerelease: false

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android-kotlin-Code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          echo $KEYSTORE | base64 -d > release.keystore

      - name: Create signing.properties
        run: |
          echo "keystore.password=${{ secrets.KEYSTORE_PASSWORD }}" > signing.properties
          echo "key.alias=${{ secrets.KEY_ALIAS }}" >> signing.properties
          echo "key.password=${{ secrets.KEY_PASSWORD }}" >> signing.properties

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        uses: ilharp/sign-android-release@v1
        id: sign_app
        with:
          releaseDir: Android-kotlin-Code/app/build/outputs/apk/release
          signingKey: release.keystore
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.sign_app.outputs.signedFile }}
          asset_name: uuvpn-android-release.apk
          asset_content_type: application/vnd.android.package-archive